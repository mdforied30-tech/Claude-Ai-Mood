<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude AI Mood</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--bd:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ac:#d97757;--ac2:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
header h1 span{color:var(--ac)}
select,button,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:7px 10px}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:94%;padding:10px 13px;border-radius:14px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--ac2);color:#fff}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.msg img{max-width:200px;border-radius:8px;display:block;margin-bottom:6px}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.msg h1,.msg h2,.msg h3{margin:8px 0 6px;font-size:16px}
.msg ul,.msg ol{margin:4px 0 8px;padding-left:20px}
code{background:#0b0d11;padding:1px 5px;border-radius:5px;font-size:.9em}
.cb{background:#0b0d11;border:1px solid var(--bd);border-radius:10px;margin:8px 0;overflow:hidden}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#14171d;font-size:12px;color:var(--mut)}
.cbh button{padding:2px 8px;font-size:12px;margin-left:4px}
.cb pre{margin:0;padding:10px;overflow-x:auto;font-size:13px}
.cb code{background:none;padding:0}
footer{padding:8px 10px;border-top:1px solid var(--bd);background:var(--card)}
#row{display:flex;gap:6px;align-items:flex-end}
#inp{flex:1;resize:none;max-height:140px;min-height:42px}
#prev{font-size:12px;color:var(--mut);padding:0 4px 4px}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:auto;padding:20px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:420px;width:92%}
dialog input,dialog textarea{width:100%;margin:6px 0}
dialog::backdrop{background:#000a}
</style>
</head>
<body>
<header>
  <h1>🧠 Claude AI <span>Mood</span></h1>
  <select id="mode">
    <option value="code">💻 Coding</option>
    <option value="research">🔎 Research (web)</option>
    <option value="write">✍️ Writing</option>
    <option value="biz">💰 Online Income</option>
    <option value="general">💬 General</option>
  </select>
  <select id="model">
    <option value="gemini-2.5-flash">Flash (fast)</option>
    <option value="gemini-2.5-pro">Pro (smart)</option>
    <option value="gemini-2.5-flash-lite">Flash-Lite (high limit)</option>
  </select>
  <button id="setb">⚙️</button>
  <button id="clr">🗑️</button>
</header>

<div id="chat"><div class="hint">👋 Ami Claude AI Mood.<br>Coding, research, lekha, business idea, image analysis, sob e help kori.<br>Prothome ⚙️ e tomar free Gemini API key boshao.</div></div>

<footer>
  <div id="prev"></div>
  <div id="row">
    <button id="att">📎</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="inp" rows="1" placeholder="Ekhane lekho..."></textarea>
    <button id="send" class="pri">➤</button>
  </div>
</footer>

<dialog id="dlg">
  <h3 style="margin-top:0">⚙️ Settings</h3>
  <label>Gemini API key (<a style="color:var(--ac)" href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> theke free)</label>
  <input id="key" type="password" placeholder="AIza...">
  <label>Extra instruction (optional)</label>
  <textarea id="extra" rows="3" placeholder="Jemon: sob uttor Banglish e dao"></textarea>
  <p style="font-size:12px;color:var(--mut)">Key ta shudhu tomar browser e thake (localStorage), kothao pathano hoy na, shudhu Google er server e request jay.</p>
  <div style="text-align:right"><button id="save" class="pri">Save</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const S={get:(k,d='')=>{try{return localStorage.getItem(k)||d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const BASE="Tumi 'Claude AI Mood', ekta powerful, bondhusulov AI assistant. User Bangladeshi, Banglish (Bangla English-e lekha) ba Bangla/English e kotha bole. User jei bhashay lekhe sei bhashay uttor dao. Uttor sohoj, short ar kajer moto rakho, mobile screen e porar upojogi. Kono kichu jana na thakle bhul tothyo banio na, sotti bolo.";
const MODES={
 code:"Tumi expert software engineer. Complete, working code dao, code block e language shoho. Beshi explain na kore agey code, tarpor short note. Bug fix e kaaron bujhao. Website hole single-file HTML (Netlify ready) bhalo.",
 research:"Tumi researcher. Google Search use kore latest tothyo anbe, source mention korbe, sure na hole bolbe.",
 write:"Tumi expert writer (Bangla ar English). Post, caption, email, pitch, script, article likho. Natural ar manusher moto tone rakho.",
 biz:"Tumi online income coach, Bangladesh context e (Fiverr, Upwork, F-commerce, freelancing, AI service). Realistic, step-by-step plan dao, fake income promise dio na, scam bhalo bhabe chiniye dao.",
 general:"Tumi general helpful assistant."
};
let hist=[],img=null,busy=false;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a style="color:var(--ac)" target="_blank" href="$2">$1</a>')}
function md(t){
  const parts=t.split(/```/);let out='';
  parts.forEach((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');const lang=(nl>-1?p.slice(0,nl):'').trim()||'code';const code=nl>-1?p.slice(nl+1):p;
      out+=`<div class="cb"><div class="cbh"><span>${esc(lang)}</span><span><button data-a="copy">Copy</button><button data-a="dl" data-l="${esc(lang)}">Download</button></span></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`}
    else{
      let html='',list=null;
      const close=()=>{if(list){html+=`</${list}>`;list=null}};
      p.split('\n').forEach(l=>{
        let m;
        if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();html+='<ul>';list='ul'}html+=`<li>${inline(m[1])}</li>`}
        else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();html+='<ol>';list='ol'}html+=`<li>${inline(m[1])}</li>`}
        else if(m=l.match(/^#{1,3}\s+(.*)/)){close();html+=`<h3>${inline(m[1])}</h3>`}
        else if(l.trim()===''){close()}
        else{close();html+=`<p>${inline(l)}</p>`}
      });close();out+=html}
  });return out;
}
const chat=$('chat');
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function clearHint(){const h=chat.querySelector('.hint');if(h)h.remove()}

chat.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const code=b.closest('.cb').querySelector('code').textContent;
  if(b.dataset.a==='copy'){navigator.clipboard.writeText(code).then(()=>{b.textContent='✓';setTimeout(()=>b.textContent='Copy',1200)}).catch(()=>{})}
  else{const l=(b.dataset.l||'txt').toLowerCase();const ext={html:'html',python:'py',py:'py',javascript:'js',js:'js',css:'css',json:'json',bash:'sh',sh:'sh',typescript:'ts',ts:'ts'}[l]||'txt';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download=(ext==='html'?'index':'file')+'.'+ext;a.click()}
});

$('att').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{img={mime:f.type,data:r.result.split(',')[1],url:r.result};$('prev').textContent='🖼️ '+f.name+' attached'};r.readAsDataURL(f);e.target.value=''};

$('setb').onclick=()=>{$('key').value=S.get('gkey');$('extra').value=S.get('extra');$('dlg').showModal()};
$('save').onclick=()=>{S.set('gkey',$('key').value.trim());S.set('extra',$('extra').value.trim());$('dlg').close()};
$('clr').onclick=()=>{hist=[];chat.innerHTML='<div class="hint">Chat clear hoyeche.</div>'};
$('mode').value=S.get('mode','code');$('model').value=S.get('model','gemini-2.5-flash');
$('mode').onchange=()=>S.set('mode',$('mode').value);$('model').onchange=()=>S.set('model',$('model').value);
$('inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
$('send').onclick=send;

async function send(){
  if(busy)return;
  const key=S.get('gkey');
  if(!key){$('setb').click();return}
  const text=$('inp').value.trim();
  if(!text&&!img)return;
  clearHint();
  const parts=[];
  if(img)parts.push({inlineData:{mimeType:img.mime,data:img.data}});
  parts.push({text:text||'Ei image ta analyze koro.'});
  add('user',(img?`<img src="${img.url}">`:'')+esc(text).replace(/\n/g,'<br>'));
  hist.push({role:'user',parts});
  $('inp').value='';$('inp').style.height='auto';img=null;$('prev').textContent='';
  const mode=$('mode').value;
  const body={
    systemInstruction:{parts:[{text:BASE+'\n'+MODES[mode]+(S.get('extra')?'\nUser instruction: '+S.get('extra'):'')}]},
    contents:hist.slice(-20)
  };
  if(mode==='research')body.tools=[{google_search:{}}];
  const out=add('bot','<i style="color:var(--mut)">Bhabchi...</i>');
  busy=true;$('send').disabled=true;
  let full='';
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${$('model').value}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok){let m=res.status+'';try{const j=await res.json();m=j.error.message}catch(e){}
      throw new Error(res.status===429?'Free limit shesh (rate limit). Ektu pore try koro ba Flash-Lite model nao.':m)}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith('data:'))continue;
        try{const j=JSON.parse(l.slice(5));
          const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
          if(t){full+=t;out.innerHTML=md(full);chat.scrollTop=chat.scrollHeight}}catch(e){}
      }
    }
    if(!full)full='(Kono uttor ashe nai, abar try koro.)';
    out.innerHTML=md(full);
    hist.push({role:'model',parts:[{text:full}]});
  }catch(e){
    out.innerHTML='⚠️ '+esc(e.message||String(e));
    hist.pop();
  }
  busy=false;$('send').disabled=false;
}
</script>
</body>
</html>
